name: All backends on

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  all-on:
    strategy:
      fail-fast: false
      matrix:
        os:
          # Linux-only coverage suite: the SDL GPU leg needs a display,
          # provided by xvfb. The apt packages are installed explicitly
          # rather than relying on runner-image contents. Windows/macOS
          # backend coverage stays with the per-backend workflows
          # (sdl3, glfw): those runners have no Vulkan driver (Windows) or
          # no Vulkan loader (macOS), so an everything-on leg there could
          # never execute the NGA tests.
          - ubuntu-24.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Install system dependencies
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y libvulkan-dev mesa-vulkan-drivers glslang-tools spirv-tools xvfb libwebp-dev libavif-dev autoconf autoconf-archive automake libtool libx11-dev libxext-dev libxfixes-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev libegl1-mesa-dev libgles2-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev libthai-dev libfribidi-dev libasound2-dev libpulse-dev
        # libwebp-dev/libavif-dev: system-first, faster than FetchContent builds
        # (malformed VEYRA_LIBWEBP_SHA256/VEYRA_LIBAVIF_SHA256 in
        # CMakeLists.txt — see roadmap §2 status), so take the system
        # libraries instead of the FetchContent download path.

      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DVEYRA_WITH_FILESYSTEM=ON
          -DVEYRA_WITH_SDL3=ON
          -DVEYRA_WITH_GLFW=ON
          -DVEYRA_WITH_TEXT=ON
          -DVEYRA_WITH_UNICODE=ON
          -DVEYRA_WITH_FREETYPE=ON
          -DVEYRA_WITH_CODECS=ON
          -DVEYRA_BUILD_BENCH=ON

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Test
        run: xvfb-run -a ctest --test-dir build --build-config Release --output-on-failure --timeout 120
