name: Unicode

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unicode:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
          - macos-26
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      # ICU has no MSVC build in this repository's dependency set, so the
      # Windows leg takes the vcpkg port while other features stay hermetic.
      - name: Install ICU
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install icu'

      - name: Configure
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVEYRA_WITH_UNICODE=ON
          -DVEYRA_BUILD_BENCH=OFF
          -DVEYRA_WITH_SDL3=OFF
          -DVEYRA_GPU_SDL=OFF

      - name: Configure
        if: runner.os != 'Windows'
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DVEYRA_WITH_UNICODE=ON
          -DVEYRA_BUILD_BENCH=OFF
          -DVEYRA_WITH_SDL3=OFF
          -DVEYRA_GPU_SDL=OFF

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure --timeout 120
