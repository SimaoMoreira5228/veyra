name: GLFW

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  glfw:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
          - macos-26
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      # Linux-only: prefer system codec libraries (faster than the
      # FetchContent build, same system-first policy as local dev).
      - name: Install system codec libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebp-dev libavif-dev

      - name: Install Linux window dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxfixes-dev libxkbcommon-dev

      - name: Configure
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DVEYRA_WITH_GLFW=ON
          -DVEYRA_WITH_SDL3=OFF
          -DVEYRA_GPU_SDL=OFF
          -DVEYRA_BUILD_BENCH=OFF

      - name: Configure
        if: runner.os != 'Windows'
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DVEYRA_WITH_GLFW=ON
          -DVEYRA_WITH_SDL3=OFF
          -DVEYRA_GPU_SDL=OFF
          -DVEYRA_BUILD_BENCH=OFF

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure
