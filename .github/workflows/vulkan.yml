name: Vulkan NGA

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  vulkan:
    strategy:
      fail-fast: false
      matrix:
        os:
          # Linux-only: the NGA parity tests fail closed without a Vulkan
          # device (no SKIP_RETURN_CODE; create_noga_context must return
          # ready, see tests/noga_rect_parity_test.cpp), and only the Linux
          # leg can provision one via lavapipe from apt. Windows runners
          # carry no GPU driver, and macOS has no Vulkan loader at all
          # (configure would silently skip the backend and test nothing);
          # the pinned slangc fallback in cmake/targets/vulkan.cmake is
          # linux-x86_64-only, and Metal/Win32 WSI is unsupported upstream.
          - ubuntu-24.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Install Vulkan driver and codec libraries
        run: sudo apt-get update && sudo apt-get install -y libvulkan-dev mesa-vulkan-drivers libwebp-dev libavif-dev
        # libwebp-dev/libavif-dev: system-first, faster than FetchContent builds
        # (malformed VEYRA_LIBWEBP_SHA256/VEYRA_LIBAVIF_SHA256 in
        # CMakeLists.txt — see roadmap §2 status), so take the system
        # libraries instead of the FetchContent download path.

      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DVEYRA_WITH_VULKAN=ON
          -DVEYRA_BUILD_BENCH=OFF

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure
